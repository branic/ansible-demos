---
name: Ansible lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover demos
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.demos.outputs.paths }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Discover demo directories and starter template
        id: demos
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          paths = ["templates/demo"]
          paths.extend(str(path) for path in sorted(Path("demos").iterdir()) if path.is_dir())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"paths={json.dumps(paths)}\n")
          PY

  lint:
    name: Production lint (${{ matrix.path }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.discover.outputs.paths) }}
    env:
      DEMO_PATH: ${{ matrix.path }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install lint tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Install demo collection and role dependencies
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          import yaml

          demo = Path(os.environ["DEMO_PATH"])
          for kind in ("collection", "role"):
              requirements = demo / f"{kind}s" / "requirements.yml"
              if not requirements.is_file():
                  continue
              data = yaml.safe_load(requirements.read_text())
              entries = data.get(f"{kind}s", []) if isinstance(data, dict) else data
              if entries:
                  subprocess.run(
                      ["ansible-galaxy", kind, "install", "-r", str(requirements)],
                      check=True,
                  )
          PY
      - name: Lint with the production profile
        run: ansible-lint --offline --config-file .ansible-lint "$DEMO_PATH"

  production-lint:
    name: Production lint
    if: ${{ always() }}
    needs:
      - discover
      - lint
    runs-on: ubuntu-latest
    steps:
      - name: Require all production lint jobs to pass
        env:
          DISCOVERY_RESULT: ${{ needs.discover.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          test "$DISCOVERY_RESULT" = success
          test "$LINT_RESULT" = success
