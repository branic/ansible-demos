---
- name: Verify hosts that have not failed
  hosts: workflow_demo
  gather_facts: false
  tasks:
    - name: Skip hosts that failed earlier in the workflow
      ansible.builtin.meta: end_host
      when: >-
        inventory_hostname in
        (__workflow_host_failure_failed_hosts | default([]))

    - name: Verify connectivity
      ansible.builtin.ping:

    - name: Demonstrate completion of the final action
      ansible.builtin.debug:
        msg: "STAGE 3 verified {{ inventory_hostname }}"
