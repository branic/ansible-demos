---
apiVersion: v1
kind: Namespace
metadata:
  name: async-timeouts-demo
  labels:
    app.kubernetes.io/part-of: async-timeouts-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: async-timeouts-http
  labels:
    app.kubernetes.io/name: async-timeouts-http
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: async-timeouts-http
  template:
    metadata:
      labels:
        app.kubernetes.io/name: async-timeouts-http
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: http
          image: registry.access.redhat.com/ubi9/python-312@sha256:105e70cb265e82beef1687b87b77444a05b410c55d8631e9aa9aa6804fcca45d
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -B
            - /app/slow_http_server.py
            - --bind
            - 0.0.0.0
            - --port
            - '8080'
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: server
              mountPath: /app
              readOnly: true
      volumes:
        - name: server
          configMap:
            name: async-timeouts-http
---
apiVersion: v1
kind: Service
metadata:
  name: async-timeouts-http
spec:
  selector:
    app.kubernetes.io/name: async-timeouts-http
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: async-timeouts-http
spec:
  to:
    kind: Service
    name: async-timeouts-http
  port:
    targetPort: http
