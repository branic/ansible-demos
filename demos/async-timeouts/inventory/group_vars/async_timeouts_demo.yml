---
ansible_connection: local
ansible_python_interpreter: "{{ ansible_playbook_python }}"
async_timeouts_http_url: http://async-timeouts-http.async-timeouts-demo.svc.cluster.local:8080/slow
async_timeouts_execution_timeout: 10
async_timeouts_poll_interval: 1
async_timeouts_poll_retries: 40
async_timeouts_failure_policy: fail_host
