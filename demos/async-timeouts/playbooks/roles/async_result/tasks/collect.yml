---
- name: Collect | Reset per-invocation state
  ansible.builtin.set_fact:
    __async_result_failed: false
    __async_result_result: {}

- name: Collect | Poll the asynchronous job
  block:
    - name: Collect | Wait for a terminal job result
      ansible.builtin.async_status:
        jid: "{{ async_result_job.ansible_job_id }}"
      register: __async_result_result
      until: __async_result_result is finished
      retries: "{{ async_result_retries }}"
      delay: "{{ async_result_delay }}"
      changed_when: false

  rescue:
    - name: Collect | Remember an unsuccessful collection
      ansible.builtin.set_fact:
        __async_result_failed: true

- name: Collect | Display the result summary
  ansible.builtin.debug:
    msg:
      host: "{{ inventory_hostname }}"
      job_id: "{{ async_result_job.ansible_job_id }}"
      finished: "{{ __async_result_result.finished | default(false) | bool }}"
      failed: "{{ __async_result_failed }}"
      message: "{{ __async_result_result.msg | default('Operation completed') }}"
      return_code: "{{ __async_result_result.rc | default('unavailable') }}"
      stderr: "{{ __async_result_result.stderr | default('') }}"
    verbosity: 0

- name: Collect | Display the complete result for troubleshooting
  ansible.builtin.debug:
    var: __async_result_result
    verbosity: 1

- name: Collect | Inspect the cache of a terminal job
  ansible.builtin.stat:
    path: "{{ __async_result_result.results_file }}"
  register: __async_result_cache
  when:
    - __async_result_result.finished | default(false) | bool
    - __async_result_result.results_file is defined

- name: Collect | Remove an existing terminal job cache
  ansible.builtin.async_status:
    jid: "{{ async_result_job.ansible_job_id }}"
    mode: cleanup
  when: (__async_result_cache.stat | default({})).exists | default(false)
  changed_when: true

- name: Collect | Explain an unfinished job
  ansible.builtin.debug:
    msg: >-
      Status polling ended before a terminal result was observed. The operation
      may still be running up to its async execution limit; its cache is retained.
    verbosity: 0
  when:
    - __async_result_failed
    - not (__async_result_result.finished | default(false) | bool)

- name: Collect | Fail only the affected host
  ansible.builtin.fail:
    msg: >-
      Async operation unsuccessful on {{ inventory_hostname }}:
      {{ __async_result_result.msg | default('No terminal result collected') }};
      rc={{ __async_result_result.rc | default('unavailable') }};
      stderr={{ __async_result_result.stderr | default('') }}
  when:
    - __async_result_failed
    - async_result_failure_policy == 'fail_host'

- name: Collect | Record the unsuccessful host for downstream exclusion
  ansible.builtin.set_stats:
    data:
      __async_timeouts_failed_hosts:
        - "{{ inventory_hostname }}"
    per_host: false
    aggregate: true
  when:
    - __async_result_failed
    - async_result_failure_policy == 'collect_and_exclude'

- name: Collect | End this host after recording it
  ansible.builtin.meta: end_host
  when:
    - __async_result_failed
    - async_result_failure_policy == 'collect_and_exclude'
