---
- name: Demonstrate a module-specific socket timeout
  hosts: demo1
  gather_facts: false
  tasks:
    - name: Run the URI example outside check mode
      when: not ansible_check_mode
      block:
        - name: Create a private directory for the HTTP fixture
          ansible.builtin.tempfile:
            state: directory
            prefix: async-timeouts-http-
          register: __async_timeouts_http_directory

        - name: Start a temporary HTTP server on an available loopback port
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/../files/slow_http_server.py"
              - --state-directory
              - "{{ __async_timeouts_http_directory.path }}"
          async: 90
          poll: 0
          register: __async_timeouts_http_job
          changed_when: true

        - name: Wait for the server to publish its endpoint
          ansible.builtin.wait_for:
            path: "{{ __async_timeouts_http_directory.path }}/endpoint.json"
            timeout: 10

        - name: Read the fixture endpoint
          ansible.builtin.slurp:
            src: "{{ __async_timeouts_http_directory.path }}/endpoint.json"
          register: __async_timeouts_http_endpoint

        - name: Remember the fixture endpoint
          ansible.builtin.set_fact:
            __async_timeouts_http_state: >-
              {{ __async_timeouts_http_endpoint.content | b64decode | from_json }}

        - name: Demonstrate a socket timeout shorter than the server delay
          block:
            - name: Request a three-second response with a one-second socket timeout
              ansible.builtin.uri:
                url: "{{ __async_timeouts_http_state.url }}/slow"
                timeout: 1
                use_proxy: false
              register: __async_timeouts_uri_attempt

            - name: Reject an unexpectedly successful short request
              ansible.builtin.fail:
                msg: The deliberately slow request should have timed out.

          rescue:
            - name: Confirm the expected socket timeout was the failure
              ansible.builtin.assert:
                that:
                  - __async_timeouts_uri_attempt.status == -1
                  - "'timed out' in (__async_timeouts_uri_attempt.msg | lower)"
                success_msg: "URI socket timeout observed as expected"

        - name: Request the same response with a sufficient socket timeout
          ansible.builtin.uri:
            url: "{{ __async_timeouts_http_state.url }}/slow"
            timeout: 6
            use_proxy: false
            return_content: true
          register: __async_timeouts_uri_success

        - name: Verify the successful response
          ansible.builtin.assert:
            that:
              - __async_timeouts_uri_success.json.message == 'Delayed response completed'
            success_msg: "URI request succeeded with the longer socket timeout"

      always:
        - name: Shut down the temporary HTTP server
          ansible.builtin.uri:
            url: "{{ __async_timeouts_http_state.url }}/shutdown"
            method: POST
            timeout: 5
            use_proxy: false
          when:
            - not ansible_check_mode
            - __async_timeouts_http_state is defined
          changed_when: true

        - name: Wait for server exit and clean its async cache
          ansible.builtin.include_tasks: tasks/clean-job.yml
          vars:
            async_timeouts_cleanup_job: "{{ __async_timeouts_http_job }}"
            async_timeouts_cleanup_retries: 100
          when:
            - not ansible_check_mode
            - __async_timeouts_http_job.ansible_job_id is defined

        - name: Remove the HTTP fixture directory
          ansible.builtin.file:
            path: "{{ __async_timeouts_http_directory.path }}"
            state: absent
          when:
            - not ansible_check_mode
            - __async_timeouts_http_directory.path is defined
